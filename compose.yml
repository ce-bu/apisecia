services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: apisecia_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: apisecia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data:Z # ':Z' flag configures SELinux permissions

volumes:
  pgdata:
